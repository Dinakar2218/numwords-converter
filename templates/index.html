<!DOCTYPE html>
<html>
<head>
    <title>Number To Words</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 450px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
        }

        input {
            width: 250px;
            padding: 12px;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            padding: 12px 35px;
            font-size: 18px;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Number To Words</h1>

    <form method="POST">

        <label>Enter Number:</label>

        <br><br>

        <input type="number"
               name="number"
               placeholder="Enter number"
               required>

        <br>

        <button type="submit">Submit</button>

    </form>

    {% if result %}

    <div class="result">
        Number in Words:
        <br><br>
        {{ result }}
    </div>

    {% endif %}

</div>

</body>
</html>
